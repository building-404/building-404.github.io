<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; max-width: 750px; margin: 50px auto; padding: 0 20px; line-height: 1.7; background: #ffffff; color: #222222; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        header { margin-bottom: 30px; }
        header a { font-size: 1.4em; font-weight: bold; color: #111; }
        hr { border: 0; border-top: 1px solid #eaeaea; margin: 20px 0; }
        pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; font-family: monospace; border: 1px solid #e1e4e8; }
        code { font-family: monospace; background: #f6f8fa; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        pre code { background: none; padding: 0; font-size: 1em; }
        footer { margin-top: 50px; font-size: 0.85em; color: #666; }
    </style>
</head>
<body>
    <header>
        <a href="/">{{ site.title }}</a>
        <p style="margin: 5px 0 0 0; color: #666; font-size: 0.9em;">{{ site.description }}</p>
        <hr>
    </header>
    <main>
        {{ content }}
    </main>
    <footer>
        <hr>
        <p>© 2026 | Built with precision on local silicon.</p>
    </footer>
</body>
</html>
