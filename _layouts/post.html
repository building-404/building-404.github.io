---
layout: default
---
<article class="post-page">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
        Published on <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
    </div>
    <div class="post-content">
        {{ content }}
    </div>
</article>
<div class="post-page">
    <a class="back-link" href="/">&larr; Back to Home</a>
</div>
