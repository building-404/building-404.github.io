kind: pipeline
type: docker
name: groot-pipeline

steps:
  # 1. Compliance scan to ensure no secrets or keys enter the Git history
  - name: secret-scan
    image: zricethezav/gitleaks:v8.28.0
    commands:
      - gitleaks git --config=.gitleaks.toml --redact --verbose .

  # 2. Compile Jekyll Markdown files into HTML inside Drone's native workspace
  - name: build-jekyll
    image: ruby:3.2-alpine
    depends_on:
      - secret-scan
    commands:
      - apk add --no-cache build-base gcc libc-dev
      - bundle install
      - bundle exec jekyll build --destination ./_site

  # 3. Securely transfer the finished HTML straight to your Synology folder mapping
  - name: deploy-to-nas-folder
    image: alpine
    depends_on:
      - build-jekyll
    volumes:
      - name: shared-pages-volume
        path: /target-folder
    commands:
      # Ensure the repository subfolder exists under building-404
      - mkdir -p /target-folder/${DRONE_REPO_NAME}
      # Clear historical build items cleanly
      - rm -rf /target-folder/${DRONE_REPO_NAME}/*
      # Copy the production build over
      - cp -R _site/* /target-folder/${DRONE_REPO_NAME}/

volumes:
  - name: shared-pages-volume
    host:
      # Points to the virtual mount directory set up inside your Drone Runner container config
      # Which links to: -v /volume1/docker/building-404:/gitea-pages-volume:rw
      path: /gitea-pages-volume

# --- Execution Conditions: Trigger strictly when a Pull Request lands into master ---
trigger:
  branch:
    - master
  event:
    - push
