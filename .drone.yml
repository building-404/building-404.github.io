kind: pipeline
type: docker
name: groot-pipeline

steps:
  # 1. Scan for credentials/keys before executing any build tasks
  - name: secret-scan
    image: zricethezav/gitleaks:v8.28.0
    commands:
      - gitleaks git --config=.gitleaks.toml --redact --verbose .

  # 2. Native CLI execution utilizing your Synology Docker socket
  - name: build-and-deploy-server
    image: docker:26.1.4-cli
    depends_on:
      - secret-scan
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      # A. Build the multi-stage Dockerfile (Baking Jekyll into Nginx)
      - docker build -t gitea-pages/${DRONE_REPO_NAME}:latest .
      
      # B. Gracefully clean up the previous blog container version if it exists
      - docker stop blog_${DRONE_REPO_NAME} || true
      - docker rm blog_${DRONE_REPO_NAME} || true
      
      # C. Deploy the fresh blog server container directly on your Macvlan network with a static IP
      - >
        docker run -d 
        --name blog_${DRONE_REPO_NAME} 
        --restart always 
        --network nginx-proxy-manager_docker_macvlan 
        --ip 192.168.69.13 
        gitea-pages/${DRONE_REPO_NAME}:latest

volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock

# --- Trigger logic: Fires immediately when a PR closes/merges into master ---
trigger:
  branch:
    - master
  event:
    - push
