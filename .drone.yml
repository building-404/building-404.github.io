kind: pipeline
type: docker
name: groot-pipeline

steps:
  # 1. Scan the codebase for hardcoded keys/secrets before processing the build
  - name: secret-scan
    image: zricethezav/gitleaks:v8.28.0
    commands:
      - gitleaks git --config=.gitleaks.toml --redact --verbose .

  # 2. Build and extract assets safely using dry_run on your Synology Docker socket
  - name: build
    image: plugins/docker:20.14.2
    depends_on:
      - secret-scan
    settings:
      repo: groot
      tags: ${DRONE_COMMIT_SHA}
      dockerfile: Dockerfile
      daemon_off: true   # Uses host Docker engine to share cache layers
      dry_run: true      # Discards final image to protect Synology storage arrays
      build_args:
        - REPO_NAME=${DRONE_REPO_NAME}
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock

volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock

# --- Trigger Strategy for Completed/Merged PRs ---
trigger:
  branch:
    - master
  event:
    - push
