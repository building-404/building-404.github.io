title: "Groot Homelab Pages"
description: "Self-hosted blogging via Gitea, Drone CI, and Docker"

# Keep these empty so assets build safely at the root level of your Nginx container
baseurl: ""
url: ""

permalink: /:categories/:year/:month/:day/:title.html

# Crucial fallback inclusions
exclude:
  - Gemfile
  - Gemfile.lock
  - .drone.yml
  - .gitleaks.toml
  - Dockerfile
